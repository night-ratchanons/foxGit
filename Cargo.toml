[package]
name = "rusttree"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "A fast Sourcetree-style Git GUI client written in Rust"
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "system_fonts", "clipboard", "links", "glow", "wayland", "x11", "persistence"] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3"
