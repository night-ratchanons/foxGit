[package]
name = "foxgit"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "FoxGit — a fast, friendly Git client (Sourcetree-style) written in Rust"
license = "MIT"
readme = "README.md"
keywords = ["git", "gui", "sourcetree", "version-control", "egui"]
categories = ["development-tools", "gui"]
publish = false

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "system_fonts", "clipboard", "links", "glow", "wayland", "x11", "persistence"] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ureq = { version = "3.5", features = ["json"] }
serde_json = "1"
keyring = "4.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3"

[target."cfg(windows)".build-dependencies]
winresource = "0.1"

# `cargo deb` (used by the release workflow) — Debian / Ubuntu package
[package.metadata.deb]
name = "foxgit"
maintainer = "FoxGit contributors"
copyright = "2026, FoxGit contributors"
license-file = ["LICENSE", "0"]
extended-description = "A fast, friendly Git client with a commit graph, hunk and line staging, branch folders, project tabs and GitHub sign-in."
section = "devel"
priority = "optional"
depends = "$auto, git"
assets = [
    ["target/release/foxgit", "usr/bin/", "755"],
    ["packaging/linux/foxgit.desktop", "usr/share/applications/", "644"],
    ["assets/icon/foxgit-256.png", "usr/share/icons/hicolor/256x256/apps/foxgit.png", "644"],
    ["assets/icon/foxgit-512.png", "usr/share/icons/hicolor/512x512/apps/foxgit.png", "644"],
    ["README.md", "usr/share/doc/foxgit/README.md", "644"],
    ["THIRD-PARTY-LICENSES.txt", "usr/share/doc/foxgit/THIRD-PARTY-LICENSES.txt", "644"],
]
