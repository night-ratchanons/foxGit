<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- FoxGit app icon. A fox face whose eyes are commit nodes joined by a merge line. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B3366"/>
      <stop offset="1" stop-color="#11152A"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="470" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5A6CFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#5A6CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB054"/>
      <stop offset="0.55" stop-color="#FF7A36"/>
      <stop offset="1" stop-color="#E8532A"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF7EE"/>
      <stop offset="1" stop-color="#F2DECB"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.38"/>
    </filter>
    <filter id="blur" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="100" y="110" width="824" height="824" rx="186" fill="#000" fill-opacity="0.30" filter="url(#blur)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <g filter="url(#shadow)">
    <!-- head -->
    <path fill="url(#fur)" d="
      M 292 236
      C 344 274, 398 326, 434 372
      Q 512 342, 590 372
      C 626 326, 680 274, 732 236
      C 768 318, 790 420, 794 500
      C 812 540, 824 566, 828 590
      C 740 660, 610 760, 512 846
      C 414 760, 284 660, 196 590
      C 200 566, 212 540, 230 500
      C 234 420, 256 318, 292 236 Z"/>
    <!-- inner ears -->
    <path fill="#3A1F33" d="M 306 286 C 342 316, 378 350, 404 382 C 368 392, 330 410, 300 436 C 292 386, 294 330, 306 286 Z"/>
    <path fill="#3A1F33" d="M 718 286 C 682 316, 646 350, 620 382 C 656 392, 694 410, 724 436 C 732 386, 730 330, 718 286 Z"/>
    <!-- cheeks / muzzle -->
    <path fill="url(#cream)" d="
      M 196 590
      C 270 560, 360 566, 420 620
      C 456 652, 488 690, 512 730
      C 536 690, 568 652, 604 620
      C 664 566, 754 560, 828 590
      C 740 660, 610 760, 512 846
      C 414 760, 284 660, 196 590 Z"/>
    <!-- nose -->
    <path fill="#1D1B2F" d="M 466 798 C 488 784, 536 784, 558 798 C 552 826, 532 844, 512 850 C 492 844, 472 826, 466 798 Z"/>

    <!-- git: two commits (the eyes) merging into one on the forehead -->
    <path d="M 404 528 C 404 478, 460 452, 512 452 C 564 452, 620 478, 620 528"
          fill="none" stroke="#FFF7EE" stroke-width="18" stroke-linecap="round"/>
    <circle cx="512" cy="452" r="21" fill="#FFF7EE"/>
    <circle cx="512" cy="452" r="9" fill="#1D1B2F"/>
    <!-- eyes = commit nodes -->
    <circle cx="404" cy="532" r="40" fill="#FFF7EE"/>
    <circle cx="404" cy="532" r="25" fill="#1D1B2F"/>
    <circle cx="413" cy="523" r="7" fill="#FFFFFF"/>
    <circle cx="620" cy="532" r="40" fill="#FFF7EE"/>
    <circle cx="620" cy="532" r="25" fill="#1D1B2F"/>
    <circle cx="629" cy="523" r="7" fill="#FFFFFF"/>
  </g>
</svg>
